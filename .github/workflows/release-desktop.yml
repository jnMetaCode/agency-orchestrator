name: Release Desktop App

# 手动触发：在 Actions 页面点 "Run workflow"，填一个 tag（如 desktop-v0.2.0）。
# 三平台构建到当前 workflow artifacts，全部验收后由单个 job 发布：
#   mac 同时出 arm64(Apple Silicon) 与 x64(Intel) 两个 dmg / win exe / linux AppImage。
# 当前为未签名版（desktop/package.json 里 mac.identity=null）。要启用 mac 签名/公证：
#   1) 去掉 desktop/package.json 的 "identity": null
#   2) 在仓库 Secrets 加 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
#   下面的步骤已透传这些 env，有就自动签、没有就出未签名版。
on:
  # 推 desktop-v* tag 自动出三平台桌面包;也可在 Actions 页手动触发并填 tag。
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. desktop-v0.2.0)"
        required: true
        default: "desktop-v0.2.0"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder_flag: "--mac --arm64 --x64"
            plat: mac
          - os: windows-latest
            builder_flag: "--win"
            plat: win
          - os: ubuntu-latest
            builder_flag: "--linux"
            plat: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      # tag 必须与 desktop/package.json 的 version 一致——否则 desktop-v0.3.0 会发出一包
      # 在「关于」里自称 0.2.0 的安装包（npm 那条流水线早就有这个闸，这里一直没有）。
      - name: Verify tag matches desktop/package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./desktop/package.json').version")
          REF="$RELEASE_TAG"
          TAG="${REF#desktop-v}"
          echo "desktop/package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $REF 与 desktop/package.json version $PKG 不一致，拒绝发布"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 引擎 + 官网 Studio（桌面 App 通过 extraResources 打包 ../dist 与 ../website/dist）
      - name: Install root deps & build engine
        run: |
          npm ci
          npm run build
      - name: Build Studio (website/dist)
        run: npm run build:studio

      # 闸 1：打包前确认前端产物完整（防 #81：website/dist 缺失/空就被打包）
      - name: Verify frontend before packaging
        run: node scripts/verify-frontend.mjs website/dist

      # 瘦身（#44）：typescript/@types/tsx/esbuild 是纯编译测试期依赖，引擎已编译成 dist、
      # 运行时用不到；语言包(agency-agents-*)虽在 devDeps 但桌面「多语言角色库」
      # 功能依赖它们被打进包——绝不能整体 prune --omit=dev，只精准剔这些构建工具。
      - name: Slim node_modules for packaging
        shell: bash   # windows-latest 默认 pwsh，rm -rf 不是 Remove-Item 的参数
        # 删包后必须清掉 .bin 里指向它们的悬空符号链接（tsc/tsserver）——
        # 悬空链接打进 mac 包会让 codesign --deep --strict 直接失败（0.4.5 的 mac 构建就死在这）。
        # 用 shell 内建 [ 判断，绝不用 `find -exec test`：PATH 里撞名的 test 程序会把判断整个带偏。
        run: |
          rm -rf node_modules/typescript node_modules/@types node_modules/tsx node_modules/esbuild node_modules/@esbuild
          for f in node_modules/.bin/*; do
            if [ -L "$f" ] && [ ! -e "$f" ]; then rm "$f"; echo "removed dangling: $f"; fi
          done

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder_flag }} --config electron-builder.config.cjs --publish never
        env:
          # 有证书/公证 Secrets 时 electron-builder 自动签名+公证；没有就出未签名版。
          # CSC_LINK 只能给 macOS：app-builder-lib 的 Windows 签名在 WIN_CSC_LINK 缺失时
          # 会兜底读 CSC_LINK——Apple 证书一填，Windows job 会拿 .p12 去 signtool，必炸
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 闸 2：确认前端真的被打进产物（electron-builder 会顺带产出 *-unpacked / mac .app，
      #       直接进去看 resources/app/website/dist 在不在；不在就 fail，绝不发白屏包）
      - name: Verify frontend landed in packaged app
        run: node scripts/verify-frontend.mjs --packed desktop/release

      # 闸 2.5：安装包里不许带纯构建期依赖（typescript/@types 共 25MB，运行时一行都不 require），
      #        且 node_modules/.bin 不许有悬空软链——摘包只删目录、不删软链，mac 打包会当场失败（出过一次）
      - name: Verify desktop payload (no build-only deps, no dangling .bin)
        run: node scripts/verify-desktop-payload.mjs desktop/release

      - name: Stage installers, checksums and build provenance
        run: node scripts/verify-desktop-release.mjs stage desktop/release release-upload ${{ matrix.plat }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.plat }}
          path: release-upload/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Default download scope is this workflow run; keep platform directories separate.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
      - name: Verify all platforms, source SHA, run ID and asset hashes
        run: node scripts/verify-desktop-release.mjs verify release-artifacts verified-assets
      # Never silently overwrite an already published release or mix with an old draft.
      - name: Refuse an existing release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            throw new Error('Release already exists. Review the existing release/draft before retrying; no assets were overwritten.');
      - name: Upload verified assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: true
          make_latest: "false"
          fail_on_unmatched_files: true
          body: |
            ## 安装 / Install

            下载对应平台的安装包并安装：

            - **macOS (Apple Silicon)** — `*-arm64.dmg`
            - **macOS (Intel)** — `*.dmg`（不带 arm64 的那个）
            - **Windows** — `*Setup*.exe`
            - **Linux** — `*.AppImage`

            桌面端**自带引擎与 Node，双击即用，无需 `npm i -g agency-orchestrator`**。只有想在终端用 `ao` 命令或接进脚本 / CI 时才需要安装 CLI。

            > 不想装、嫌下面的签名提示麻烦？**用网页版也行**：`npm i -g agency-orchestrator && ao web`（功能和桌面版一样，key 只存本机），或直接打开 https://ao.aiolaola.com 演示体验。

            ### macOS 提示「已损坏，无法打开」或「无法检查其是否包含恶意软件」？
            两句话是同一件事的两种文案 —— 未签名版的正常提示，不是真的损坏、也不是真有恶意软件。
            先把 App 拖进「应用程序」（**必须先拖过去，在 dmg 里直接开是没用的**），再在「终端」运行：

                sudo xattr -cr "/Applications/Agency Orchestrator.app"

            **然后再双击一次** —— 命令执行完不会自动打开，之前那个弹窗也不会自己消失，
            很容易误以为没生效。想确认命令是否奏效，可运行 `xattr -l "/Applications/Agency Orchestrator.app"`，
            没有输出就说明隔离属性已清掉。

            ### Windows 弹「Windows 已保护你的电脑」？
            点「更多信息」→「仍要运行」。

            ### 校验完整性（可选）
            每个平台附带 `SHA256SUMS-<平台>.txt`，对照下载文件：

                shasum -a 256 <下载的文件名>

            > 当前为未签名版（无 Apple 公证 / Windows 签名），以上提示在后续签名版本中会自动消失。
          files: verified-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish complete release and mark latest
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
