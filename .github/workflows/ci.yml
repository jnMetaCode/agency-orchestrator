name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # test/ 不在 tsconfig 的 include 里（避免进 dist），所以单靠 build 查不出测试的类型错误。
      # 曾经积了 43 个：其中两条测试因此成了摆设（传了不存在的选项、对没有该字段的表排序）。
      - name: Typecheck tests
        run: npm run typecheck:test

      # web-server 冒烟测试会请求 SPA 深层路由，需要前端产物存在（否则 server 返回 503 → 测试挂）。
      # 与 release.yml 对齐：test 前构建 Studio。
      - name: Build Studio
        run: npm run build:studio

      # 确认构建出的 dist/cli.js 实现了源码声明的所有命令（防 #80：发布陈旧 dist）
      - name: Verify CLI command parity
        run: node scripts/verify-cli.mjs

      - name: Clone agency-agents-zh for tests
        run: git clone --depth 1 https://github.com/jnMetaCode/agency-agents-zh.git

      - name: Run tests
        run: npm test

  # Dockerfile 以前只在 v* tag 时才被构建一次——坏了要到发版当天才知道，而那时 npm 已经发出去了
  # （本仓库「CI-only 步骤等于没测过」那条教训的正中靶心）。这里在 PR 上就构建一遍，不推送。
  # 单架构即可：要验的是 Dockerfile 本身跑不跑得通（apt 装得上、npm 装得上、ffmpeg 在不在）。
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ao-ci-test:latest
      - name: "ffmpeg 必须在镜像里（type: concat 的硬依赖）"
        run: docker run --rm --entrypoint ffmpeg ao-ci-test:latest -version | head -1
