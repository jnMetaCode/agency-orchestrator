# Docker 镜像发布（#93）：构建多架构镜像推到 GHCR（用仓库自带 GITHUB_TOKEN，无需 Docker Hub 账号）
#   手动触发：gh workflow run release-docker.yml -f version=0.11.0
#   version = 要打包的 npm 版本（也作为镜像 tag），同时刷新 :latest
name: Release Docker Image

on:
  # 跟随 npm 发版自动出镜像——此前只有手动触发，Docker/NAS 用户曾停在旧版一个月
  # （npm 已到 0.16.0、镜像还是 7 月的），README 又在推荐 docker run，等于推荐旧版。
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "npm 版本号（如 0.11.0），镜像 tag 同名并刷新 latest"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      # 同一个 v* tag 会同时触发本工作流与 npm 发布——而 Dockerfile 是从 npm 装包的，
      # 不等的话必然 ETARGET（版本还没发上去）。轮询最多 20 分钟，等不到就明确失败。
      - name: Wait for version on npm
        run: |
          v="${{ steps.ver.outputs.version }}"
          for i in $(seq 1 40); do
            if npm view "agency-orchestrator@$v" version >/dev/null 2>&1; then
              echo "npm 已有 $v"; exit 0
            fi
            echo "等待 npm 出现 $v（$i/40）…"; sleep 30
          done
          echo "20 分钟仍未在 npm 看到 $v——检查 release.yml 是否失败"; exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AO_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/jnmetacode/agency-orchestrator:${{ steps.ver.outputs.version }}
            ghcr.io/jnmetacode/agency-orchestrator:latest
