name: "一人公司·做产品"
description: "你出想法，AI 团队出货：产品经理写 PRD、架构师定方案、工程师排计划，老板（你）拿到能直接开工的启动包"
category: "一人公司"
featured: true

agents_dir: "agency-agents-zh"

llm:
  provider: deepseek
  model: deepseek-chat

concurrency: 2

# 交付物：上线包（PRD / 架构 / 冲刺计划是施工图，留在运行目录里）
deliverables: [launch_pack]

inputs:
  - name: idea
    description: "你的产品想法（如：帮自由职业者自动记账开发票的小工具）"
    required: true
  # 不写团队规模时，模型会按常识脑补出工程师 / PM / 其他产品线，行动清单一个人根本执行不了
  - name: team
    description: "团队规模（有真人协作者就写清人数和分工）"
    default: "创始人 1 人 + AI 团队，没有其他真人员工"
  - name: timeline
    description: "交付周期（如：7 天、4 周）"
    default: "4 周"

steps:
  - id: ceo_brief
    role: "company/chief-executive-officer"
    name: "老板"
    emoji: "👔"
    task: |
      你是这家一人公司的 CEO。创始人的想法：{{idea}}
      团队：{{team}}。交付周期：{{timeline}}。
      所有分工只能落在这个团队里：不许虚构员工、部门，也不许挪用其他项目或产品线的人力。

      给团队下达开工简报：
      1. 产品一句话定位
      2. 目标用户与核心痛点
      3. 这一版只做什么、坚决不做什么（范围栅栏）
      4. {{timeline}}后的验收画面

      像晨会讲话一样简洁有力，说人话。
    output: brief

  - id: prd
    role: "product/product-manager"
    name: "产品经理"
    emoji: "🧭"
    task: |
      老板的开工简报：{{brief}}

      作为产品经理，输出 MVP 的 PRD：
      1. 用户画像与使用场景（具体到人、时间、动机）
      2. 核心功能 3 个（每个写清用户操作路径和解决的问题）
      3. 明确砍掉的功能及理由
      4. 第一版上线标准（可衡量的指标）
    acceptance: |
      1. 包含用户/场景/功能/优先级/上线标准五个部分
      2. 每个功能都有具体的用户操作路径，没有"待定"
      3. 上线标准可量化（数字或可判定的条件）
    output: prd_doc
    depends_on: [ceo_brief]

  - id: architecture
    role: "engineering/engineering-backend-architect"
    name: "技术总监"
    emoji: "💻"
    task: |
      PRD 已出：{{prd_doc}}

      作为技术架构师，输出一人能 hold 住的技术方案：
      1. 技术栈选型及理由（选熟不选新）
      2. 核心模块与数据流（文字画清楚关系）
      3. 明确不引入的东西（防过度设计清单）
      4. 主要技术风险与规避方案
    acceptance: |
      1. 技术栈每一项都给出"为什么是它"的理由
      2. 有防过度设计清单
    output: tech_plan
    depends_on: [prd]

  - id: sprint_plan
    role: "product/product-sprint-prioritizer"
    name: "项目主管"
    emoji: "📋"
    task: |
      PRD：{{prd_doc}}
      技术方案：{{tech_plan}}

      团队：{{team}}。交付周期：{{timeline}}。

      作为项目主管，排出 {{timeline}} 的冲刺计划：
      1. 按阶段拆解（周期 14 天以内按天，更长按周），每个阶段有明确可交付物
      2. 每个阶段标注"完成的定义"
      3. 留出 20% 缓冲，标明可顺延项
      4. 每项任务的负责人只能是上面团队里的人（或 AI 角色），工作量按这个团队的真实产能估
    output: sprint
    depends_on: [architecture]

  - id: launch_pack
    role: "company/chief-executive-officer"
    name: "老板"
    emoji: "👔"
    task: |
      团队交付齐了：

      **PRD**：{{prd_doc}}
      **技术方案**：{{tech_plan}}
      **冲刺计划**：{{sprint}}

      团队：{{team}}。交付周期：{{timeline}}。

      作为 CEO 整合输出《产品启动包》：
      ## 决策：Go / No-Go 及一句话理由
      ## 定稿 PRD 摘要（可直接贴给任何协作者）
      ## 技术方案摘要
      ## 第一周每日行动清单
      ## Top 3 风险与应对

      ⚠️ 只输出最终成品本身：不要开场白、不要复盘或说明、不要向用户提问、不要建议任何命令或后续动作。
      ⚠️ 行动清单和资源安排只能用「{{team}}」里的人，不要为这个项目暂停或挪用其他项目。
    acceptance: |
      1. 五个章节齐全，无"待补充"
      2. 第一周行动清单具体到每天可执行
      3. 每个风险都配了应对动作
      4. 行动清单的负责人都在「{{team}}」范围内，没有虚构的员工、部门或其他项目的人力
    output: launch_pack_doc
    depends_on: [sprint_plan]
