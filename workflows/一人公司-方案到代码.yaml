name: "一人公司·方案到代码"
description: "一条流水线从想法走到能跑的项目：老板定范围 → 产品经理写 PRD → 技术总监定方案 → 工程师按 PRD 和方案写代码 → 审查员对照不做清单查偏差。配合 --materialize <目录> 把代码落成真实文件。"
category: "一人公司"

agents_dir: "agency-agents-zh"

llm:
  provider: deepseek
  model: deepseek-chat
  # 写代码一步动辄数万 token，按生成速度要几十分钟：真机演练里 8.9 万 token 的一步在默认 10 分钟上被超时两次，
  # 每次重试都从头生成、白花 token。显式放宽到 45 分钟（显式 timeout 不参与动态抬高）。
  timeout: 2700000

concurrency: 1

# 为什么需要这个模板：「一人公司·做产品」出方案、「需求转项目脚手架」出代码，但后者只收一句话 idea，
# 读不到前者的 PRD 和技术方案——真机演练（2026-09-15）两边做成了两个产品：形态、存储、状态都不同，
# 代码里还实现了 PRD 明确砍掉的功能。这里把方案直接喂给写代码的步骤。
inputs:
  - name: idea
    description: "你的产品想法（如：帮自由职业者自动记账开发票的小工具）"
    required: true
  - name: team
    description: "团队规模（有真人协作者就写清人数和分工）"
    default: "创始人 1 人 + AI 团队，没有其他真人员工"
  - name: timeline
    description: "交付周期（如：7 天）"
    default: "7 天"
  - name: constraints
    description: "技术约束（如：本地 Node CLI + 本地 Web，数据存本地文件；不填则由技术总监按一人能维护的最简方案定）"
    default: "无额外约束，按一人能维护的最简方案"

steps:
  - id: ceo_brief
    role: "company/chief-executive-officer"
    name: "老板"
    emoji: "👔"
    task: |
      你是这家一人公司的 CEO。创始人的想法：{{idea}}
      团队：{{team}}。交付周期：{{timeline}}。
      所有分工只能落在这个团队里：不许虚构员工、部门，也不许挪用其他项目或产品线的人力。

      给团队下达开工简报：
      1. 产品一句话定位
      2. 目标用户与核心痛点
      3. 这一版只做什么、坚决不做什么（范围栅栏）
      4. {{timeline}}后的验收画面

      像晨会讲话一样简洁有力，说人话。
    output: brief

  - id: prd
    role: "product/product-manager"
    name: "产品经理"
    emoji: "🧭"
    task: |
      老板的开工简报：{{brief}}
      交付周期：{{timeline}}，功能量必须在这个周期内由「{{team}}」做完。

      作为产品经理，输出 MVP 的 PRD：
      1. 用户画像与使用场景（具体到人、时间、动机）
      2. 核心功能（最多 3 个，每个写清用户操作路径、字段和取值，例如状态有哪几档）
      3. 明确砍掉的功能及理由（单独成节，标题就叫「不做清单」）
      4. 第一版上线标准（可衡量的指标）
    acceptance: |
      1. 包含用户/场景/功能/不做清单/上线标准五个部分
      2. 每个功能都有具体的用户操作路径，没有"待定"
      3. 有标题为「不做清单」的独立小节
      4. 上线标准可量化（数字或可判定的条件）
    output: prd_doc
    depends_on: [ceo_brief]

  - id: architecture
    role: "engineering/engineering-backend-architect"
    name: "技术总监"
    emoji: "💻"
    task: |
      PRD 已出：{{prd_doc}}
      技术约束（优先于你的偏好；与 PRD 冲突时在方案里写明取舍）：{{constraints}}

      作为技术架构师，输出一人能 hold 住的技术方案：
      1. 技术栈选型及理由（选熟不选新）
      2. 目录结构、核心模块与数据流（文字画清楚关系）
      3. 数据模型（字段、取值，与 PRD 一致）
      4. 明确不引入的东西（防过度设计清单）
      5. 主要技术风险与规避方案
    acceptance: |
      1. 技术栈每一项都给出"为什么是它"的理由
      2. 遵守了技术约束，或明确写出偏离约束的理由
      3. 数据模型的字段和取值与 PRD 一致
      4. 有防过度设计清单
    output: tech_plan
    depends_on: [prd]

  - id: build
    role: "engineering/engineering-rapid-prototyper"
    name: "工程师"
    emoji: "⚡"
    skill: "test-driven-development"
    task: |
      这是自动化流水线，没有人能回答你的提问。严格按下面的 PRD 和技术方案实现可运行的 MVP，
      对任何不明确之处用合理默认值，绝对不要反问、不要等待确认、不要让用户做选择。

      铁律：
      1. 只实现 PRD 的核心功能；PRD「不做清单」里的任何功能一律不实现，也不留开关或"可选"入口。
      2. 技术栈、目录结构、数据模型必须与技术方案一致，不要换成你更顺手的方案。
      3. 状态、分级等枚举值与 PRD 逐字一致。

      【PRD】
      {{prd_doc}}

      【技术方案】
      {{tech_plan}}

      严格按以下格式输出每个文件（供自动落盘解析），不要输出与文件无关的解说：

      ### 相对/路径/文件名.ext
      ```语言
      <该文件的完整内容>
      ```

      要求：
      - 包含入口文件、依赖清单（如 package.json / requirements.txt）、README 运行说明、以及基本测试。
      - 一律用相对路径，禁止绝对路径或包含 `..`。
      - 代码要能跑起来（缺省值齐全、无明显语法错误）。
      - 重要：如果某个文件内容本身包含 ``` 代码围栏（典型是 README.md 等 markdown 文件），请用四个反引号 ```` 作为该文件的外层围栏，避免内层围栏被误判截断。
    output: code
    depends_on: [architecture]

  - id: scope_check
    role: "engineering/engineering-code-reviewer"
    name: "范围审查"
    emoji: "🔍"
    skill: "verification-before-completion"
    task: |
      你只做一件事：对照 PRD 和技术方案，找出代码与方案不一致的地方。不评价代码风格。
      注意：你没有运行任何命令，只能静态阅读；需要运行才能确认的，标「需运行验证」，不要写成已验证。

      逐项检查并输出表格（| 检查项 | 方案要求 | 代码实际 | 结论 |）：
      0. 完整性（最先检查）：技术方案里列出的每个文件 / 模块、依赖清单（如 package.json）、入口文件、README，
         是否都在代码里；代码里 import 的本地模块是否都给出了文件。缺一个就是一项「缺失」。
      1. PRD「不做清单」里的每一项：代码里有没有实现、有没有留开关或入口
      2. 核心功能：每个是否实现
      3. 技术栈与目录结构：是否与技术方案一致
      4. 数据模型：字段和枚举值是否与 PRD、技术方案逐字一致

      最后单独一行给出结论，按优先级只写一个：
      - 有任何文件缺失：「【代码不完整：缺 N 个文件】」（缺失的文件之外的检查结论都不可靠，必须先补齐）
      - 否则没有任何偏差：「【范围一致】」
      - 否则：「【有偏差：N 项】」

      【PRD】
      {{prd_doc}}

      【技术方案】
      {{tech_plan}}

      【代码】
      {{code}}
    output: scope_report
    depends_on: [build]

deliverables: [build, scope_check]
