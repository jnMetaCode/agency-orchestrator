# 展示 type:video 文生视频步骤的内置模板——一句创意直接出片。
#
# 两处刻意的设计（与「图文内容套装」同源）：
#   1. video.model / video_provider 走**必填输入**：各家视频模型编码互不通用，绝不替用户猜。
#   2. 默认 768P × 5 秒 = 最便宜的验证档（秘塔约 0.09 元/秒，一条 ≈ 0.45 元）。
#      视频按秒计费，方向没定之前不该跑 2K 十秒——引擎绝不替用户放大。
#   3. 分辨率与秒数也做成输入：**两家档位名不通用**（秘塔 480p/512p/768P/2K，
#      APIMart 720p/1080p/4k，且 VEO3 固定 8 秒）。写死一家的档位，换供应商就会被服务商直接拒。
#
name: "一句话出短片"
description: "一句创意 → 提示词工程师按 5 段式写成电影感提示词 → 文生视频直接出片，产出可直接发布的 mp4"
category: "内容创作"

agents_dir: "agency-agents-zh"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  max_tokens: 4096

inputs:
  - name: idea
    label: "创意"
    description: "你想拍什么（如：一只橘猫在窗台上看日落，治愈风 / 一双跑鞋在雨夜街头的广告片）"
    required: true
  - name: genre
    label: "类型"
    description: "短片类型：提示词工程师按类型套用对应的节奏与运镜习惯"
    required: false
    default: ""
    options: ["产品广告片", "治愈日常", "剧情片段", "悬疑惊悚", "搞笑段子", "科幻", "古风武侠", "宠物", "美食", "城市风光"]
  - name: style
    label: "视觉风格"
    description: "从风格库选（可留空，让提示词工程师按创意自行决定）；也可自己写一段描述"
    required: false
    default: ""
    source: styles
  - name: video_provider
    label: "视频供应商"
    description: "视频供应商（Studio 里下拉可选；已配 key 的排前）"
    required: true
    default: "metaso"
    source: video_providers
  - name: video_model
    label: "视频模型"
    description: "视频模型编码（各家互不通用，秘塔填 MiniMax-H3；APIMart 可填 veo3.1-fast / sora-2 等）"
    required: true
    default: "MiniMax-H3"
    source: models
    source_from: video_provider
  - name: video_resolution
    label: "分辨率"
    description: "分辨率档位。**两家不通用**：秘塔 480p/512p/768P/2K；APIMart 720p/1080p/4k。换供应商必须一起换"
    required: true
    default: "768P"
    source: video_resolutions
    source_from: video_provider
  - name: reference_image
    label: "首帧参考图"
    format: url
    description: "首帧参考图（可选，图生视频）：公网图片 URL。留空 = 纯文生视频。本地图片只有 APIMart 能用（引擎自动上传），秘塔只收公网 URL"
    required: false
    default: ""
  - name: video_ratio
    label: "宽高比"
    description: "16:9 横屏 / 9:16 竖屏；候选按模型给"
    required: true
    default: "16:9"
    source: video_ratios
    source_from: video_provider
  - name: video_duration
    label: "秒数"
    description: "秒数（按秒计费）。秘塔可 4~10 秒；APIMart 的 VEO3 固定 8 秒——填错会被服务商直接拒"
    required: true
    default: "5"
    source: video_durations
    source_from: video_provider

steps:
  - id: shot_prompt
    role: "design/design-video-prompt-engineer"
    name: "提示词工程师"
    emoji: "🎬"
    task: |
      把这个创意写成一条 **{{video_duration}} 秒短视频**的提示词：{{idea}}
      类型（若非空，按该类型的节奏与运镜习惯写）：{{genre}}
      视觉风格（若非空，第 3 段【氛围与画质】必须落实这里的摄影机/胶片/色调/光源）：{{style}}

      按 5 段式结构写，每段一行，段与段之间空一行。
      **每段必须以下面这五个方括号标记开头，一字不差**（下游要靠它们定位，缺一段即判不合格）：
      1. 【核心主题】3-6 个 tag 用 | 分隔，从"画面类型 → 题材 → 美学风格"递进
      2. 【人物与设定】面部 / 服装 / 场景三行；服装写**质地**不写品类；至少两处瑕疵（磨损、尘土、汗渍）
      3. 【氛围与画质】必须写具体**摄影机型号 + 镜头型号** + 色调 + 光源（如：索尼威尼斯电影机 + 佳能 K-35 系列镜头，低饱和灰蓝调，侧逆光）
      4. 【运镜规则】镜头方式 / 角度 / 呼吸感三行；呼吸感固定写"手持拍摄，全程保持极其轻微的、如呼吸般的镜头浮动"
      5. 【分镜】按秒切片（如 0-2s / 2-4s / … 各发生什么），**必须覆盖满 {{video_duration}} 秒**，最后补一行【声音】

      硬要求：
      - 每段都要有具体名词。"电影感""高级""震撼"这类空泛词单独出现即为不合格
      - 不出现任何影视 IP 名、角色名、明星姓名——改写成特征描述
      - 全文控制在 220 字以内：模型注意力有限，写长了反而不听话
      - 只输出提示词本身，不要解释、不要前言后语
    skill: "shortfilm-prompt"
    # 分工：**脚本审结构，模型审内容**（core/assert.ts 的原话）。
    # 教训（2026-08-28 真机 7 次采样）：验收里一并写上"五段齐全""呼吸感那句在""【声音】独立成行"
    # "220 字以内"这些**脚本已经数过**的条目后，7/7 全部触发返工、返工后仍有 4/7 判未过——
    # 验收员会去挑结构毛病（"约230字，超出220""呼吸感未单独成行"），于是每跑一次白付一轮返工，
    # 而且验收长期显示未过，用户会**学会无视验收**，比没有验收更糟。
    # 所以这里只留脚本判不了的东西。
    acceptance: |
      1. 【氛围与画质】写的是**具体摄影机型号 + 镜头型号 + 色调 + 光源**（如"索尼威尼斯 + 佳能 K-35，低饱和灰蓝，侧逆光"），不是"电影级设备""高级质感"这类空话
      2. 【分镜】每一片写的是**具体动作**（谁做了什么），不是"氛围很好""情绪到位"这类形容
      3. 全文不含任何影视 IP 名、角色名、明星姓名（把特征描述写出来不算）
      4. "电影感 / 高级 / 震撼"这类空泛词没有作为独立描述出现（作为核心主题里的风格标签不算）
    assert:
      min_bytes: 200          # 防截断：不到 200 字节说明生成断流了
      max_bytes: 800          # 目标 220 字；800 字节≈265 字，留出余量。再长就是"写飞了"，厂商侧会直接拒收
      contains:
        - "【核心主题】"
        - "【人物与设定】"
        - "【氛围与画质】"
        - "【运镜规则】"
        - "【分镜】"
        - "【声音】"
        - "如呼吸般的镜头浮动"
    output: video_prompt

  - id: negative
    role: "design/design-video-prompt-engineer"
    name: "反穿帮清单"
    emoji: "🚫"
    task: |
      为上面这条提示词写一组负面提示词，并说明每组挡什么（表格，4-6 行）：

      {{video_prompt}}

      至少覆盖：手部崩坏、画面内乱码文字/水印、主体变形、动作不连贯、塑料感/游戏 CG 感。
      输出格式：| 负面词组 | 挡的是 |
    acceptance: |
      1. 是一张 Markdown 表格，正文 4-6 行（不含表头与分隔行）
      2. 手部崩坏、乱码文字/水印、主体变形、动作不连贯、塑料感/游戏 CG 感——五类全部覆盖
      3. 每行的"挡的是"写的是**这条提示词里的具体风险**，不是通用套话
    output: negative_prompt
    depends_on: [shot_prompt]

  - id: clip
    type: video
    name: "出片"
    emoji: "🎬"
    task: "{{video_prompt}}"
    video:
      provider: "{{video_provider}}"
      model: "{{video_model}}"
      resolution: "{{video_resolution}}"   # 必填；档位名各家不通用，所以做成输入而不是写死
      duration: "{{video_duration}}"
      image: "{{reference_image}}"       # 按秒计费，默认用最短档验证方向
      ratio: "{{video_ratio}}"
    output: clip_mp4
    depends_on: [shot_prompt]

  - id: pack
    role: "design/design-video-prompt-engineer"
    name: "成片交付"
    emoji: "📦"
    task: |
      把这次的成果整理成一页可存档的交付说明：

      成片：{{clip_mp4}}
      提示词：{{video_prompt}}
      负面提示词：{{negative_prompt}}

      需要包含：
      1. 成片引用（原样保留上面那行链接）
      2. 这条提示词的三个关键选择及理由（为什么用这台摄影机 / 这个色调 / 这个运镜）
      3. 如果要重跑，最值得改的两处是什么
      4. 一句话成本提示：这一条按 {{video_resolution}} × {{video_duration}} 秒计费；方向满意再上更高档或加长
    acceptance: |
      1. 成片链接**原样保留**，一个字符都没改写（改了就点不开，等于这次的钱白花）
      2. 三个关键选择各给了理由，且理由指向提示词里的具体措辞
      3. 有"重跑最值得改的两处"，且是具体可操作的改动，不是"多试几次"
    output: delivery
    depends_on: [clip, negative]
