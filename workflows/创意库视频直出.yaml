name: 创意库视频直出
description: 使用已有提示词直接生成视频，不调用文本模型
category: 内容创作
inputs:
  - { name: prompt, label: 提示词, required: true }
  - { name: video_provider, label: 视频供应商, required: true, source: video_providers }
  - { name: video_model, label: 视频模型, required: true, source: models, source_from: video_provider }
  - { name: video_resolution, label: 分辨率, default: "", source: video_resolutions, source_from: video_provider }
  - { name: video_duration, label: 秒数, required: true, source: video_durations, source_from: video_provider }
  - { name: video_ratio, label: 宽高比, default: "", source: video_ratios, source_from: video_provider }
llm:
  provider: deepseek
  model: deepseek-chat
steps:
  - id: clip
    name: 视频生成
    type: video
    task: "{{prompt}}"
    video:
      provider: "{{video_provider}}"
      model: "{{video_model}}"
      resolution: "{{video_resolution}}"
      duration: "{{video_duration}}"
      ratio: "{{video_ratio}}"
    output: clip_mp4
