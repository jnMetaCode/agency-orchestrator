    condition: "{{narration}} contains 配旁白"
    task: |
      只给【镜头 2】写一条**旁白**（画外音）。

      {{script}}

      已经写好的前面几镜旁白（不要重复它们说过的信息）：
      镜1：{{narration1}}

      硬要求：
      - **必须能在 {{video_duration}} 秒内不赶地念完**：中文口播约每秒 4–5 字，
        所以全文不超过 {{video_duration}} × 4 个字。念不完会被截断，成片里就是半句话
      - 旁白补的是**画面之外**的信息（人物在想什么、时间过去了多久、这件事的分量），
        不复述画面里已经看得见的动作
      - 口语、短句；不要"命运的齿轮开始转动"这类旁白腔空话
      - 不含任何影视 IP、角色名、明星姓名
      - 只输出这一句旁白本身，不要引号、不要解释、不要"镜2："这类前缀
    # 字数上限交给 assert.max_bytes 数（脚本审结构），验收只判内容
    acceptance: |
      1. 只有一条旁白，没有前缀、引号和解释
      2. 补的是画面之外的信息，不是复述画面里看得见的动作
      3. 口语短句，没有"命运的齿轮"这类旁白腔空话
      4. 不含任何影视 IP、角色名、明星姓名
    assert:
      max_bytes: 200        # {{video_duration}}×4 字上限的宽松上界（≈66 汉字）；超出必然念不完
    output: narration2
    depends_on: [script, narration1]

