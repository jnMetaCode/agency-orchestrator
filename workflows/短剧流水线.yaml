  - id: film
    type: concat
    name: "三镜合成 + 后期"
    emoji: "🎞"
    # depends_on 带上旁白与配音这六步，是为了拿到它们的产出；用 any_completed 是因为
    # 「不配音」时它们会被 condition 跳过——默认的 all 模式会连这一步一起跳掉，
    # 于是三镜都出好了却拼不出成片。执行是按层推进的，所以不存在抢在出片前就合成的风险。
    #
    # 旁白三步**必须**在 depends_on 里（哪怕 subtitles 只是引用它们的产出）：
    # 被跳过步骤的输出只对**直接依赖方**补空串，不列进来的话，关掉旁白时
    # subtitles 里的 {{narration1}} 会直接抛「模板变量未定义」。
    depends_on_mode: any_completed
    concat:
      inputs: ["{{shot1_mp4}}", "{{shot2_mp4}}", "{{shot3_mp4}}"]   # 本机 ffmpeg，不花厂商的钱
      voiceover: ["{{vo1_audio}}", "{{vo2_audio}}", "{{vo3_audio}}"] # 跳过配音时这三个是空串 = 这段不配音
      subtitles: ["{{narration1}}", "{{narration2}}", "{{narration3}}"]
      bgm: "{{bgm_file}}"
      bgm_volume: 0.22
      # 片段自带音轨压到 0.3 给旁白让路。视频模型本来就出声、而且常是成句对白——
      # 觉得原声更好听就调回 1（旁白会同强度并存），想完全换成旁白就写 0。
      clip_volume: 0.3
    output: film_mp4
    depends_on: [shot1, shot2, shot3, narration1, narration2, narration3, vo1, vo2, vo3]

  - id: pack
    role: "design/design-visual-storyteller"
    name: "交付页"
    emoji: "📦"
    task: |
      整理成一页可存档的短剧交付说明：

      成片（三镜合成）：{{film_mp4}}
      定妆图：{{character_img}}
      镜头 1：{{shot1_mp4}}
      镜头 2：{{shot2_mp4}}
      镜头 3：{{shot3_mp4}}

      剧本：
      {{script}}

      需要包含：
      1. 成片、定妆图与三镜的引用（原样保留上面五行链接，按顺序；成片放最前）
      2. 每镜一句"这一镜在讲什么"
      3. 若要重跑，最值得改的两处（角色一致性 / 运镜 / 节奏）
      4. 成本一行：3 镜 × {{video_duration}} 秒 × {{video_resolution}}（合成不花钱，本机 ffmpeg）
    acceptance: |
      1. 五行链接（成片、定妆图、三镜）**原样保留**且顺序正确，成片在最前——改写一个字符就点不开
      2. 每镜一句"这一镜在讲什么"，说的是画面内容不是技术参数
      3. 重跑建议是具体改动（改哪一段、怎么改），不是"多抽几次"
    output: delivery
    depends_on: [film]
