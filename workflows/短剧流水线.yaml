# 短剧流水线（3 镜）——剧本 → 主角定妆图 → 逐镜图生视频 → 交付。
#
# 对标"短剧 Agent"类产品的核心链路，但三点不同（这是 AO 的位置）：
#   1. 模型你选：定妆图用哪家图片模型、出片用哪家视频模型都是输入，换赞助商就是换下拉。
#   2. 成本可见：3 镜各按秒计费，默认最短档；方向满意再加长、上更高档。
#   3. 流水线是你的：换个剧本再跑一遍，不是留在别人平台里的"创作历史"。
#
# 角色一致性靠 **图生视频**：三镜都以同一张定妆图为首帧（video.image），人物不会镜镜变脸。
# 注意：秘塔只收公网 URL 的首帧图，本流水线的定妆图是本机产物，所以视频供应商默认 APIMart（自带上传）。
name: "短剧流水线（3 镜）"
description: "一段故事 → 编剧写 3 镜微剧本 → 主角定妆图（文生图）→ 三镜提示词并行 → 三镜以定妆图为首帧并行出片 → 交付页。角色一致靠图生视频，模型和成本你说了算。"
category: "内容创作"
agents_dir: "agency-agents-zh"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  max_tokens: 4096

concurrency: 3

inputs:
  - name: story
    label: "故事梗概"
    description: "故事梗概（两三句即可，如：末日废城里一个机器人清道夫捡到一只会说话的鸵鸟）"
    required: true
  - name: genre
    label: "类型"
    description: "短剧类型：决定编剧怎么写三镜的节奏与冲突"
    required: true
    default: "剧情短剧"
    options: ["剧情短剧", "产品广告片", "治愈日常", "悬疑惊悚", "搞笑段子", "科幻", "古风武侠", "纪实 Vlog"]
  - name: style
    label: "视觉风格"
    description: "视觉风格：从风格库选（引擎会把它展开成摄影机/胶片/色调/光源的英文提示词后缀，逐镜一致），也可自己写一段描述"
    required: true
    default: "美式复古好莱坞"
    source: styles
  - name: image_provider
    label: "图片供应商"
    description: "定妆图用哪家图片供应商（留空 = 跟随文本供应商；需 OpenAI 兼容的 API 服务商）"
    required: false
    default: ""
    source: image_providers
  - name: image_model
    label: "图片模型"
    description: "图片模型编码（各家互不通用；选了供应商后下拉列出）"
    required: true
    source: models
    source_from: image_provider
  - name: video_provider
    label: "视频供应商"
    description: "视频供应商。本流水线用本机定妆图做首帧，需要有上传接口的供应商（APIMart）；秘塔只收公网 URL"
    required: true
    default: "apimart"
    source: video_providers
  - name: video_model
    label: "视频模型"
    description: "视频模型编码（各家互不通用）"
    required: true
    default: "veo3.1-fast"
    source: models
    source_from: video_provider
  - name: video_resolution
    label: "分辨率"
    description: "分辨率档位（按模型给候选；sora-2 只有 720p，veo 可到 4k，H3 是 2K/768P）"
    required: true
    default: "720p"
    source: video_resolutions
    source_from: video_provider
  - name: video_ratio
    label: "宽高比"
    description: "16:9 横屏 / 9:16 竖屏（抖音、视频号）；候选按模型给"
    required: true
    default: "16:9"
    source: video_ratios
    source_from: video_provider
  - name: narration
    label: "旁白配音"
    description: "要不要给三镜配旁白。**先听一遍原片**——Veo3 / Sora2 / H3 这些模型本来就出声音，常常自带对白，够用就别再叠旁白。选了会同时得到配音和字幕（字幕即旁白文案；本机 ffmpeg 缺 libass 时自动退成软字幕轨并告知，`ao doctor --media-probe` 可提前查这家有没有语音端点）"
    required: true
    default: "不配音"
    options: ["不配音", "配旁白"]
  - name: tts_provider
    show_when: "{{narration}} contains 配旁白"   # 选了「不配音」这项就收起来，别让人猜要不要填
    label: "语音供应商"
    description: "配音走哪家（留空 = 跟随文本供应商）。需要 OpenAI 兼容且开了 /audio/speech 的服务商；没有这条端点的会明确报「这家没有语音端点」，不是你参数填错"
    required: false
    default: ""
    source: tts_providers
  - name: tts_model
    show_when: "{{narration}} contains 配旁白"   # 选了「不配音」这项就收起来，别让人猜要不要填
    label: "语音模型"
    description: "语音模型编码（各家互不通用，如 OpenAI 的 gpt-4o-mini-tts）；选了供应商后下拉列出"
    required: false
    default: ""
    source: models
    source_from: tts_provider
  - name: tts_voice
    show_when: "{{narration}} contains 配旁白"   # 选了「不配音」这项就收起来，别让人猜要不要填
    label: "音色"
    description: "音色 id（各家互不通用，猜不得）。OpenAI 常见：alloy / echo / nova / onyx / shimmer；别家见其文档"
    required: false
    default: ""
  - name: bgm_file
    label: "背景音乐"
    format: url
    description: "背景音乐文件的本机路径（可选，留空 = 不加）。循环铺满全片、末尾 2 秒淡出，默认压到 0.25 不盖过人声"
    required: false
    default: ""
  - name: video_duration
    label: "每镜秒数"
    description: "每镜秒数（按秒计费，3 镜合计 ×3；veo3 固定 8 秒）"
    required: true
    default: "8"
    source: video_durations
    source_from: video_provider

steps:
  - id: script
    role: "game-development/narrative-designer"
    name: "编剧"
    emoji: "✍️"
    task: |
      把这个故事写成一部 **3 镜微短剧**的剧本：{{story}}
      类型：{{genre}}（按这个类型的常规节奏与冲突写：广告片要有产品露出与记忆点，悬疑要有悬念钩子，搞笑要有反转，Vlog 要像真实记录）
      视觉风格：{{style}}

      输出严格按下面结构，不要多余解释：

      ## 主角
      一段 60 字以内的外形描述：性别/年龄感、面部特征、服装（写质地不写品类）、两处瑕疵（磨损/尘土/伤痕）。
      **三镜里主角外形不变**，后面定妆图和每一镜都引用这段。

      ## 镜头 1（建立）
      场景 / 主角在做什么 / 情绪 / 这一镜结束时的画面（各一行）

      ## 镜头 2（冲突）
      同上结构

      ## 镜头 3（转折或收束）
      同上结构

      硬要求：不出现任何影视 IP、角色名、明星姓名；三镜发生在不超过两个场景里；每镜能在 {{video_duration}} 秒内演完。
    acceptance: |
      1. 【主角】是一段 60 字以内的外形描述，且面部特征、服装质地、两处瑕疵都写到了
      2. 三镜分别落在"建立 / 冲突 / 转折或收束"上，不是三段并列的平铺
      3. 三镜发生在不超过两个场景里（换景越多，出片时越对不上）
      4. 每镜的动作量能在 {{video_duration}} 秒内演完，不是塞了三件事
      5. 全文不含任何影视 IP、角色名、明星姓名
      6. 镜头 3 收在克制的画面上——不堆爆炸/光爆/粒子，人停住、呼吸、留白
    assert:
      # 少写一镜是这一步最贵的翻车：下游三个提示词步骤照跑不误，
      # 直到花钱出片才发现镜 3 是编的。数标题这种事不该交给模型验收员。
      contains: ["## 主角", "## 镜头 1", "## 镜头 2", "## 镜头 3"]
      min_bytes: 300
    output: script

  - id: character_prompt
    role: "design/design-image-prompt-engineer"
    name: "定妆图提示词"
    emoji: "🧍"
    task: |
      根据剧本里的【主角】段落，写一条**角色定妆图**的文生图提示词（正面全身、干净浅灰背景、柔和棚光、{{style}}）：

      {{script}}

      要求：把主角外形描述逐项落实到画面（面部、服装质地、两处瑕疵都要在）；写明摄影机与镜头型号；
      全文 150 字以内；只输出提示词本身。
    acceptance: |
      1. 主角外形逐项落实：面部特征、服装质地、两处瑕疵，一样不缺
      2. 写明了具体摄影机型号 + 镜头型号，不是"专业设备""高清"这类空话
      3. 正面全身、浅灰背景、柔和棚光三项都在（这是定妆图，不是剧照）
      4. 不含任何影视 IP 名、角色名、明星姓名
      5. 只有提示词本身，没有解释和前后语
    assert:
      min_bytes: 120
      max_bytes: 700          # 目标 150 字（≈450 字节）；超出说明写成剧照描述了
    output: character_prompt
    depends_on: [script]

  - id: character
    type: image
    name: "主角定妆图"
    emoji: "🎨"
    task: "{{character_prompt}}"
    image:
      provider: "{{image_provider}}"
      model: "{{image_model}}"
      size: "1024x1536"
    # 看图验收：文本供应商（须支持 vision）对着成品图核对，未过带着未满足项重出一张（再花一张图的钱）。
    # 只写画面里**看得见**的硬条件——软性的"好看""有电影感"模型判不准，写了只会白花一轮重出。
    acceptance: |
      1. 画面里只有一个人物，正面、全身可见（头顶到脚都在画面内）
      2. 背景是干净的浅色单色，没有场景、道具、文字或水印
      3. 人物与提示词描述的性别、年龄段、服装一致
    output: character_img
    depends_on: [character_prompt]

  - id: shot1_prompt
    role: "design/design-image-prompt-engineer"
    name: "镜头 1 提示词"
    emoji: "🎬"
    task: |
      只针对剧本的【镜头 1】写一条 {{video_duration}} 秒视频提示词（5 段式：核心主题 tag | 人物与设定 | 氛围与画质（摄影机+镜头型号+色调+光源）| 运镜 | 按秒分镜+声音）。
      视觉风格：{{style}}。人物外形必须与【主角】段落一致（首帧会用定妆图，提示词里重点写动作和运镜，不要重新描述长相）。
      220 字以内，只输出提示词本身。
      **五段必须以【核心主题】【人物与设定】【氛围与画质】【运镜规则】【分镜】开头，一字不差**，
      【运镜规则】里固定带上"手持拍摄，全程保持极其轻微的、如呼吸般的镜头浮动"，末尾单独一行【声音】。

      {{script}}
    skill: "shortfilm-prompt"
    # 结构（五段标记、呼吸感那句、【声音】行、字数上限）由下面的 assert 用脚本数——
    # 写进验收只会让验收员去挑结构毛病，导致每跑一次都白返工一轮。这里只留脚本判不了的。
    acceptance: |
      1. 【氛围与画质】的摄影机/镜头/色调/光源与另两镜**一致**（三镜是一部片，不是三条广告）
      2. 重点写动作与运镜，**没有重新描述长相**（首帧已由定妆图锁定，再描述会和定妆图打架）
      3. 每段都有具体名词，不是"氛围很好""质感高级"这类形容
      4. 不含任何影视 IP 名、角色名、明星姓名
    assert:
      min_bytes: 200
      max_bytes: 1100        # 目标 220 字（≈660 字节）+ 五段标记、固定呼吸感句、【声音】行约 150 字节；900 真机两次卡在 938
      contains:
        - "【核心主题】"
        - "【人物与设定】"
        - "【氛围与画质】"
        - "【运镜规则】"
        - "【分镜】"
        - "【声音】"
        - "如呼吸般的镜头浮动"
    output: shot1_prompt
    depends_on: [script]

  - id: shot2_prompt
    role: "design/design-image-prompt-engineer"
    name: "镜头 2 提示词"
    emoji: "🎬"
    task: |
      只针对剧本的【镜头 2】写一条 {{video_duration}} 秒视频提示词（5 段式：核心主题 tag | 人物与设定 | 氛围与画质（摄影机+镜头型号+色调+光源）| 运镜 | 按秒分镜+声音）。
      视觉风格：{{style}}。人物外形必须与【主角】段落一致（首帧会用定妆图，重点写动作和运镜）。
      220 字以内，只输出提示词本身。
      **五段必须以【核心主题】【人物与设定】【氛围与画质】【运镜规则】【分镜】开头，一字不差**，
      【运镜规则】里固定带上"手持拍摄，全程保持极其轻微的、如呼吸般的镜头浮动"，末尾单独一行【声音】。

      {{script}}
    skill: "shortfilm-prompt"
    # 结构（五段标记、呼吸感那句、【声音】行、字数上限）由下面的 assert 用脚本数——
    # 写进验收只会让验收员去挑结构毛病，导致每跑一次都白返工一轮。这里只留脚本判不了的。
    acceptance: |
      1. 【氛围与画质】的摄影机/镜头/色调/光源与另两镜**一致**（三镜是一部片，不是三条广告）
      2. 重点写动作与运镜，**没有重新描述长相**（首帧已由定妆图锁定，再描述会和定妆图打架）
      3. 每段都有具体名词，不是"氛围很好""质感高级"这类形容
      4. 不含任何影视 IP 名、角色名、明星姓名
    assert:
      min_bytes: 200
      max_bytes: 1100        # 目标 220 字（≈660 字节）+ 五段标记、固定呼吸感句、【声音】行约 150 字节；900 真机两次卡在 938
      contains:
        - "【核心主题】"
        - "【人物与设定】"
        - "【氛围与画质】"
        - "【运镜规则】"
        - "【分镜】"
        - "【声音】"
        - "如呼吸般的镜头浮动"
    output: shot2_prompt
    depends_on: [script]

  - id: shot3_prompt
    role: "design/design-image-prompt-engineer"
    name: "镜头 3 提示词"
    emoji: "🎬"
    task: |
      只针对剧本的【镜头 3】写一条 {{video_duration}} 秒视频提示词（5 段式：核心主题 tag | 人物与设定 | 氛围与画质（摄影机+镜头型号+色调+光源）| 运镜 | 按秒分镜+声音）。
      视觉风格：{{style}}。人物外形必须与【主角】段落一致（首帧会用定妆图，重点写动作和运镜）。
      220 字以内，只输出提示词本身。
      **五段必须以【核心主题】【人物与设定】【氛围与画质】【运镜规则】【分镜】开头，一字不差**，
      【运镜规则】里固定带上"手持拍摄，全程保持极其轻微的、如呼吸般的镜头浮动"，末尾单独一行【声音】。

      {{script}}
    skill: "shortfilm-prompt"
    # 结构（五段标记、呼吸感那句、【声音】行、字数上限）由下面的 assert 用脚本数——
    # 写进验收只会让验收员去挑结构毛病，导致每跑一次都白返工一轮。这里只留脚本判不了的。
    acceptance: |
      1. 【氛围与画质】的摄影机/镜头/色调/光源与另两镜**一致**（三镜是一部片，不是三条广告）
      2. 重点写动作与运镜，**没有重新描述长相**（首帧已由定妆图锁定，再描述会和定妆图打架）
      3. 每段都有具体名词，不是"氛围很好""质感高级"这类形容
      4. 不含任何影视 IP 名、角色名、明星姓名；且这一镜是收尾——克制，不堆爆炸/光爆/粒子
    assert:
      min_bytes: 200
      max_bytes: 1100        # 目标 220 字（≈660 字节）+ 五段标记、固定呼吸感句、【声音】行约 150 字节；900 真机两次卡在 938
      contains:
        - "【核心主题】"
        - "【人物与设定】"
        - "【氛围与画质】"
        - "【运镜规则】"
        - "【分镜】"
        - "【声音】"
        - "如呼吸般的镜头浮动"
    output: shot3_prompt
    depends_on: [script]

  - id: narration1
    role: "game-development/narrative-designer"
    name: "镜 1 旁白"
    emoji: "📝"
    condition: "{{narration}} contains 配旁白"
    task: |
      只给【镜头 1】写一条**旁白**（画外音）。

      {{script}}

      硬要求：
      - **必须能在 {{video_duration}} 秒内不赶地念完**：中文口播约每秒 4–5 字，
        所以全文不超过 {{video_duration}} × 4 个字。念不完会被截断，成片里就是半句话
      - 旁白补的是**画面之外**的信息（人物在想什么、时间过去了多久、这件事的分量），
        不复述画面里已经看得见的动作
      - 口语、短句；不要"命运的齿轮开始转动"这类旁白腔空话
      - 不含任何影视 IP、角色名、明星姓名
      - 只输出这一句旁白本身，不要引号、不要解释、不要"镜1："这类前缀
    # 字数上限交给 assert.max_bytes 数（脚本审结构），验收只判内容
    acceptance: |
      1. 只有一条旁白，没有前缀、引号和解释
      2. 补的是画面之外的信息，不是复述画面里看得见的动作
      3. 口语短句，没有"命运的齿轮"这类旁白腔空话
      4. 不含任何影视 IP、角色名、明星姓名
    assert:
      max_bytes: 200        # {{video_duration}}×4 字上限的宽松上界（≈66 汉字）；超出必然念不完
    output: narration1
    depends_on: [script]

  - id: vo1
    type: tts
    name: "镜 1 配音"
    emoji: "🎙"
    condition: "{{narration}} contains 配旁白"
    task: "{{narration1}}"
    tts:
      provider: "{{tts_provider}}"
      model: "{{tts_model}}"
      voice: "{{tts_voice}}"
    output: vo1_audio
